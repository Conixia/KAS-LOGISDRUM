<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Konfirmasi Pembayaran Kas Logisdrum</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

    <div class="container">

        <!-- ================= HALAMAN 1 ================= -->

        <section id="page1" class="card">

            <div class="logo">

                💰

            </div>

            <h1>Kas Logisdrum</h1>

            <p>

                Silakan pilih nama Anda untuk melakukan konfirmasi pembayaran kas.

            </p>

            <select id="nama">

                <option value="">-- Pilih Nama --</option>

                <option>Fadli</option>

                <option>Ibal</option>

                <option>Pai</option>

                <option>Asam</option>

                <option>Rapli</option>

                <option>Adnin</option>

            </select>

            <button id="nextBtn">

                Next →

            </button>

        </section>

        <!-- ================= HALAMAN 2 ================= -->

        <section id="page2" class="card hidden">

            <h2>Konfirmasi Pembayaran</h2>

            <div class="info">

                <label>Nama Anggota</label>

                <div class="box" id="namaTerpilih"></div>

            </div>

            <div class="rekening">

                <div class="bankLogo">

                    🏦

                </div>

                <small>Transfer ke</small>

                <h3>GOPAY</h3>

                <h2 id="rekening">

                    082223858540

                </h2>

                <p>

                    a.n Muhammad Adnin Mubarok

                </p>

                <button id="copyBtn">

                    📋 Salin Nomor Rekening

                </button>

            </div>

            <div class="upload">

                <label>

                    Upload Bukti Transfer

                </label>

                <input

                    type="file"

                    id="bukti"

                    accept="image/png,image/jpeg,image/jpg">

            </div>

            <div class="checkbox">

                <input

                    type="checkbox"

                    id="check">

                <label for="check">

                    Saya sudah melakukan transfer.

                </label>

            </div>

            <button id="submitBtn">

                Kirim Konfirmasi

            </button>

        </section>

        <!-- ================= SUCCESS ================= -->

        <section id="success" class="card hidden">

            <div class="successIcon">

                ✅

            </div>

            <h2>

                Konfirmasi Berhasil

            </h2>

            <p>

                Terima kasih.

                Bukti pembayaran Anda berhasil dikirim.

            </p>

            <button onclick="location.reload()">

                Kembali ke Awal

            </button>

        </section>

    </div>

    <script src="script.js"></script>

</body>

</html>
